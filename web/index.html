<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>ReTeX</title>
    <meta
      name="description"
      content="Edit LaTeX and preview it live in your browser. ReTeX compiles locally with Rust and WebAssembly."
    />
    <script>
      try {
        document.documentElement.dataset.theme =
          localStorage.getItem("retex-theme") ||
          (matchMedia("(prefers-color-scheme: dark)").matches
            ? "dark"
            : "light");
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="./app/workspace/main.tsx"></script>
  </body>
</html>
